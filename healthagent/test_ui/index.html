<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>healthagent local test harness</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!--
    LOCAL DEV ONLY. This page uses a Supabase key directly in client-side
    JS and a hardcoded test user_id with no login flow. Never ship this
    pattern to a real client — it exists only to prove the gateway/queue/
    worker loop closes end-to-end before the real mobile app is wired up.
  -->
  <h1>healthagent test harness</h1>

  <label>Supabase URL: <input id="url" size="40" /></label><br />
  <label>Supabase Key (anon or service): <input id="key" size="40" /></label><br />
  <label>Test user_id (any UUID): <input id="uid" value="00000000-0000-0000-0000-000000000001" size="40" /></label><br />
  <button id="connect">Connect</button>

  <hr />

  <select id="event_type">
    <option value="alcohol">alcohol</option>
    <option value="eating">eating</option>
    <option value="exercise">exercise</option>
    <option value="sauna">sauna</option>
  </select>
  <button id="start" disabled>Start</button>
  <button id="stop" disabled>Stop</button>

  <hr />
  <h2>Activity session</h2>
  <select id="activity_type">
    <option value="running">running</option>
    <option value="cycling">cycling</option>
    <option value="walking">walking</option>
    <option value="yoga">yoga</option>
  </select>
  <label>minutes <input id="activity_minutes" value="30" size="4" /></label>
  <button id="finish_activity" disabled>Finish session</button>
  <div id="report" style="max-width:46em;font-family:system-ui;line-height:1.5"></div>

  <h3>Log</h3>
  <pre id="log"></pre>

  <script>
    let sb;
    let currentEventId = null;

    function log(line) {
      document.getElementById("log").textContent += line + "\n";
    }

    document.getElementById("connect").onclick = () => {
      const url = document.getElementById("url").value;
      const key = document.getElementById("key").value;
      sb = window.supabase.createClient(url, key);

      const userId = document.getElementById("uid").value;
      sb
        .channel("predictions_changes")
        .on(
          "postgres_changes",
          { event: "INSERT", schema: "public", table: "predictions", filter: `user_id=eq.${userId}` },
          (payload) => {
            log("[" + payload.new.kind + " | data: " + payload.new.data_quality + "] " + payload.new.summary);
            renderReport(payload.new);
          }
        )
        .subscribe();

      log("connected, subscribed to predictions for user " + userId);
      document.getElementById("start").disabled = false;
      document.getElementById("stop").disabled = false;
      document.getElementById("finish_activity").disabled = false;
    };

    document.getElementById("start").onclick = async () => {
      const userId = document.getElementById("uid").value;
      const eventType = document.getElementById("event_type").value;

      const { data, error } = await sb
        .from("events")
        .insert({ user_id: userId, event_type: eventType, status: "started", source: "manual" })
        .select()
        .single();

      if (error) {
        log("insert failed: " + error.message);
        return;
      }
      currentEventId = data.id;
      log("started event " + currentEventId + " (" + eventType + ")");
    };

    document.getElementById("stop").onclick = async () => {
      if (!currentEventId) {
        log("no active event to stop");
        return;
      }
      const { error } = await sb
        .from("events")
        .update({ status: "ended", ended_at: new Date().toISOString() })
        .eq("id", currentEventId);

      if (error) {
        log("update failed: " + error.message);
        return;
      }
      log("stopped event " + currentEventId);
      currentEventId = null;
    };

    // Render an activity_summary the moment Realtime delivers it. No polling: the row
    // arrives on its own once the agent finishes in the background.
    function renderReport(row) {
      if (row.kind !== "activity_summary") return;
      const r = row.analysis;
      const score = r.score
        ? `<p><b>Score ${r.score.value}/${r.score.scale}</b> — ${r.score.label}
             <i>(${r.score.basis})</i></p>`
        : "<p><i>Not enough history yet for a score.</i></p>";
      const gaps = (r.data_gaps || []).length
        ? `<p><small>unavailable sources: ${r.data_gaps
             .map((g) => g.source + " (" + g.status + ")").join(", ")}</small></p>`
        : "";
      document.getElementById("report").innerHTML =
        `<h3>${r.headline}</h3>` + score +
        r.sections.map((s) => `<h4>${s.title}</h4><p>${s.body}</p>`).join("") +
        `<p><small>data quality: ${r.data_quality}` +
        (row.guardrail_flags && row.guardrail_flags.length
          ? " | flags: " + row.guardrail_flags.join(", ") : "") +
        `</small></p>` + gaps;
    }

    document.getElementById("finish_activity").onclick = async () => {
      const userId = document.getElementById("uid").value;
      const minutes = Math.max(3, parseInt(document.getElementById("activity_minutes").value, 10) || 30);
      const id = crypto.randomUUID();
      const ended = new Date();
      const started = new Date(ended.getTime() - minutes * 60 * 1000);
      const samples = Array.from({ length: minutes * 20 }, (_, i) => ({
        heartRate: 138 + (i % 9), spo2: 97,
      }));

      document.getElementById("report").innerHTML = "<p><i>Session saved. The report will appear here when the agent finishes…</i></p>";
      const { error } = await sb.from("activity_sessions").insert({
        id, user_id: userId,
        activity_type: document.getElementById("activity_type").value,
        started_at: started.toISOString(), ended_at: ended.toISOString(),
        duration_seconds: minutes * 60,
        summary: { heartRate: 142, spo2: 97, hrv: 48 },
        samples,
      });
      log(error ? "activity insert failed: " + error.message
                : "activity session " + id + " saved, waiting for the report…");
    };
  </script>
</body>
</html>
