services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    env_file: .env
    profiles: ["tools"]

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "8090:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  activity-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.activity-worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.scheduler
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  score-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.score-worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
