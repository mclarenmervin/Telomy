# F12 operational therapy catalogue and acute wearable hypotheses.
#
# Operational descriptions, dose shapes, and contraindication identifiers make
# a modality browseable and safety-screenable. `effects` is deliberately
# optional: an empty list is more honest than inventing a wearable claim.
# Effects that are present are acute (the hour after versus the hour before),
# declared in advance, and remain hidden as physiology explanations until a
# clinician signs their content fingerprint.

version: therapies.v2

dose_schemas:
  duration: &duration
    duration_minutes: {type: integer, unit: minutes, minimum: 1, maximum: 240}
  heat: &heat
    duration_minutes: {type: integer, unit: minutes, minimum: 1, maximum: 90}
    temperature_celsius: {type: number, unit: celsius, optional: true}
  cold: &cold
    duration_seconds: {type: integer, unit: seconds, minimum: 10, maximum: 1800}
    temperature_celsius: {type: number, unit: celsius, optional: true}
  pressure: &pressure
    duration_minutes: {type: integer, unit: minutes, minimum: 1, maximum: 180}
    pressure_ata: {type: number, unit: ATA, minimum: 1.0, maximum: 3.0}
  light: &light
    duration_minutes: {type: integer, unit: minutes, minimum: 1, maximum: 90}
    irradiance_mw_cm2: {type: number, unit: mW/cm2, optional: true}
  iv: &iv
    duration_minutes: {type: integer, unit: minutes, minimum: 1, maximum: 240}
    volume_ml: {type: number, unit: mL, minimum: 1}

modalities:
  - id: sauna
    label: Sauna
    category: heat
    summary: A supervised dry-heat session.
    intended_experience: Sustained warmth followed by a gradual cool-down.
    event_types: [sauna]
    dose_schema: *heat
    contraindication_rule_ids: [pregnancy, uncontrolled_blood_pressure, recent_cardiac_event, alcohol_today]
    effects:
      - metric: heartRate
        expect: increase
        mechanism: >
          Heat stress drives cutaneous vasodilation, and heart rate rises to
          maintain blood pressure and cardiac output while blood is shifted to
          the skin. The rise persists for a period after leaving the heat.
        citation: >
          Laukkanen JA, Laukkanen T, Kunutsor SK. Cardiovascular and other
          health benefits of sauna bathing. Mayo Clin Proc 2018;93(8):1111-1121.
      - metric: temperature
        expect: increase
        mechanism: >
          Core and skin temperature rise during heat exposure and fall back
          over the period afterwards, so an immediate post-session reading can
          remain above the person's own baseline.
        citation: >
          Hussain J, Cohen M. Clinical effects of regular dry sauna bathing.
          Evid Based Complement Alternat Med 2018;2018:1857413.

  - id: infrared_sauna
    label: Infrared sauna
    category: heat
    summary: A heat session using infrared-emitting panels.
    intended_experience: Sustained warmth at a centre-configured temperature.
    event_types: [infrared_sauna]
    dose_schema: *heat
    contraindication_rule_ids: [pregnancy, uncontrolled_blood_pressure, recent_cardiac_event, alcohol_today]
    effects: []

  - id: steam_room
    label: Steam room
    category: heat
    summary: A supervised humid-heat session.
    intended_experience: Warm, high-humidity exposure followed by cool-down.
    event_types: [steam_room]
    dose_schema: *heat
    contraindication_rule_ids: [pregnancy, uncontrolled_blood_pressure, recent_cardiac_event, alcohol_today]
    effects: []

  - id: cold_plunge
    label: Cold plunge
    category: cold
    summary: A timed cold-water immersion session.
    intended_experience: Brief cold exposure with a supervised exit and rewarming period.
    event_types: [cold_plunge]
    dose_schema: *cold
    contraindication_rule_ids: [pregnancy, raynaud, uncontrolled_blood_pressure, recent_cardiac_event]
    effects:
      - metric: hrv
        expect: increase
        mechanism: >
          Cold water immersion can be followed by parasympathetic reactivation,
          increasing heart rate variability relative to the pre-session period.
        citation: >
          Buchheit M, Peiffer JJ, Abbiss CR, Laursen PB. Effect of cold water
          immersion on postexercise parasympathetic reactivation. Am J Physiol
          Heart Circ Physiol 2009;296(2):H421-H427.
      - metric: heartRate
        expect: decrease
        mechanism: >
          Vagal activation and peripheral vasoconstriction can reduce the heart
          rate required to maintain cardiac output after immersion.
        citation: >
          Bleakley CM, Davison GW. What is the biochemical and physiological
          rationale for using cold-water immersion in sports recovery? Br J
          Sports Med 2010;44(3):179-187.

  - id: contrast_therapy
    label: Contrast therapy
    category: thermal
    summary: Alternating supervised warm and cold exposures.
    intended_experience: Repeated temperature transitions with planned recovery intervals.
    event_types: [contrast_therapy]
    dose_schema:
      rounds: {type: integer, unit: rounds, minimum: 1, maximum: 20}
      warm_seconds: {type: integer, unit: seconds, minimum: 10}
      cold_seconds: {type: integer, unit: seconds, minimum: 10}
    contraindication_rule_ids: [pregnancy, raynaud, uncontrolled_blood_pressure, recent_cardiac_event, alcohol_today]
    effects: []

  - id: cryotherapy
    label: Whole-body cryotherapy
    category: cold
    summary: A brief whole-body exposure in a purpose-built cold chamber.
    intended_experience: Short intense cold exposure under centre supervision.
    event_types: [cryotherapy]
    dose_schema: *cold
    contraindication_rule_ids: [pregnancy, raynaud, uncontrolled_blood_pressure, recent_cardiac_event, coronary_plaque]
    effects: []

  - id: hbot
    label: Hyperbaric oxygen therapy
    category: oxygen
    summary: A prescribed session in a clinical hyperbaric chamber.
    intended_experience: Monitored oxygen exposure above normal atmospheric pressure.
    event_types: [hbot]
    dose_schema: *pressure
    contraindication_rule_ids: [untreated_pneumothorax, recent_cardiac_event]
    effects: []

  - id: mild_hbot
    label: Mild hyperbaric oxygen
    category: oxygen
    summary: A lower-pressure session in a compatible chamber.
    intended_experience: Monitored exposure at the prescribed mild pressure.
    event_types: [mild_hbot]
    dose_schema: *pressure
    contraindication_rule_ids: [untreated_pneumothorax, recent_cardiac_event]
    effects: []

  - id: red_light
    label: Red-light therapy
    category: light
    summary: A timed photobiomodulation session using configured light panels.
    intended_experience: Non-contact light exposure over the planned area.
    event_types: [red_light_therapy]
    dose_schema: *light
    contraindication_rule_ids: [photosensitising_medication]
    effects: []

  - id: pemf
    label: PEMF
    category: electromagnetic
    summary: A pulsed electromagnetic field session using centre equipment.
    intended_experience: A timed, non-invasive exposure at the configured programme.
    event_types: [pemf]
    dose_schema:
      duration_minutes: {type: integer, unit: minutes, minimum: 1, maximum: 180}
      programme: {type: string, unit: programme}
    contraindication_rule_ids: [pacemaker, pregnancy]
    effects: []

  - id: hydrogen_inhalation
    label: Hydrogen inhalation
    category: respiratory
    summary: A timed inhalation session using centre-configured equipment.
    intended_experience: Seated inhalation at the prescribed flow setting.
    event_types: [hydrogen_inhalation]
    dose_schema:
      duration_minutes: {type: integer, unit: minutes, minimum: 1, maximum: 240}
      flow_ml_min: {type: number, unit: mL/min, optional: true}
    contraindication_rule_ids: []
    effects: []

  - id: ihht
    label: IHHT
    category: respiratory
    summary: Intermittent hypoxic-hyperoxic breathing under trained supervision.
    intended_experience: Alternating prescribed breathing intervals with monitoring.
    event_types: [ihht]
    dose_schema:
      cycles: {type: integer, unit: cycles, minimum: 1, maximum: 30}
      duration_minutes: {type: integer, unit: minutes, minimum: 1, maximum: 180}
    contraindication_rule_ids: [pregnancy, uncontrolled_blood_pressure, recent_cardiac_event]
    effects: []

  - id: ewot
    label: EWOT
    category: oxygen
    summary: Exercise with oxygen therapy using centre equipment.
    intended_experience: Prescribed exercise while breathing an enriched gas mixture.
    event_types: [ewot]
    dose_schema:
      duration_minutes: {type: integer, unit: minutes, minimum: 1, maximum: 180}
      workload: {type: number, unit: centre_defined, optional: true}
    contraindication_rule_ids: [pregnancy, uncontrolled_blood_pressure, recent_cardiac_event]
    effects: []

  - id: compression
    label: Compression therapy
    category: recovery
    summary: A pneumatic compression session using fitted sleeves or boots.
    intended_experience: Cycled pressure at the prescribed programme and intensity.
    event_types: [compression_therapy]
    dose_schema:
      duration_minutes: {type: integer, unit: minutes, minimum: 1, maximum: 180}
      pressure_mmhg: {type: number, unit: mmHg, optional: true}
    contraindication_rule_ids: [dvt, uncontrolled_blood_pressure]
    effects: []

  - id: vibroacoustic
    label: Vibroacoustic therapy
    category: recovery
    summary: A session combining low-frequency vibration and sound.
    intended_experience: Reclined exposure to a configured sound and vibration programme.
    event_types: [vibroacoustic_therapy]
    dose_schema: *duration
    contraindication_rule_ids: [pregnancy, pacemaker]
    effects: []

  - id: float_therapy
    label: Float therapy
    category: recovery
    summary: A private float session in a high-buoyancy environment.
    intended_experience: Reduced external stimulation while floating with minimal effort.
    event_types: [float_therapy]
    dose_schema: *duration
    contraindication_rule_ids: []
    effects: []

  - id: iv_vitamin_c
    label: IV vitamin C
    category: infusion
    summary: A clinician-prescribed vitamin C infusion.
    intended_experience: A monitored intravenous infusion at the prescribed dose.
    event_types: [iv_vitamin_c]
    dose_schema: *iv
    contraindication_rule_ids: [g6pd_deficiency]
    effects: []

  - id: iv_hydration
    label: IV hydration
    category: infusion
    summary: A clinician-prescribed hydration infusion.
    intended_experience: A monitored intravenous fluid session.
    event_types: [iv_hydration]
    dose_schema: *iv
    contraindication_rule_ids: []
    effects: []

  - id: whole_body_vibration
    label: Whole-body vibration
    category: movement
    summary: A timed session on a configured vibration platform.
    intended_experience: Standing or supported exposure at the prescribed setting.
    event_types: [whole_body_vibration]
    dose_schema:
      duration_minutes: {type: integer, unit: minutes, minimum: 1, maximum: 60}
      frequency_hz: {type: number, unit: Hz, optional: true}
    contraindication_rule_ids: [pregnancy, pacemaker, recent_cardiac_event]
    effects: []

  - id: salt_therapy
    label: Salt therapy
    category: respiratory
    summary: A timed session in a centre-managed salt room.
    intended_experience: Seated rest in the configured room environment.
    event_types: [salt_therapy]
    dose_schema: *duration
    contraindication_rule_ids: []
    effects: []

  - id: breathwork
    label: Guided breathwork
    category: mind_body
    summary: A facilitated session following a defined breathing programme.
    intended_experience: Guided breathing with the option to pause at any time.
    event_types: [guided_breathwork]
    dose_schema: *duration
    contraindication_rule_ids: [pregnancy, uncontrolled_blood_pressure, recent_cardiac_event]
    effects: []

  - id: lymphatic_drainage
    label: Lymphatic drainage
    category: bodywork
    summary: A manual or device-assisted drainage session.
    intended_experience: Gentle, protocol-led bodywork by trained centre staff.
    event_types: [lymphatic_drainage]
    dose_schema: *duration
    contraindication_rule_ids: [dvt, recent_cardiac_event]
    effects: []

  - id: massage
    label: Therapeutic massage
    category: bodywork
    summary: A practitioner-led massage session with a recorded modality and duration.
    intended_experience: Hands-on bodywork adjusted to the agreed comfort level.
    event_types: [therapeutic_massage]
    dose_schema: *duration
    contraindication_rule_ids: [dvt]
    effects: []

  - id: acupuncture
    label: Acupuncture
    category: bodywork
    summary: A practitioner-led acupuncture session.
    intended_experience: A timed session delivered by a qualified practitioner.
    event_types: [acupuncture]
    dose_schema: *duration
    contraindication_rule_ids: []
    effects: []

  - id: normobaric_oxygen
    label: Normobaric oxygen
    category: oxygen
    summary: A timed oxygen session at normal atmospheric pressure.
    intended_experience: Seated oxygen exposure at the prescribed flow setting.
    event_types: [normobaric_oxygen]
    dose_schema:
      duration_minutes: {type: integer, unit: minutes, minimum: 1, maximum: 240}
      flow_l_min: {type: number, unit: L/min, optional: true}
    contraindication_rule_ids: []
    effects: []

# Signatures bind only declared effect mechanisms and citations. Operational
# catalogue publication is versioned separately in the database.
clinical_review:
  effects: []
