# Telomy biomarker catalog — the global reference range set.
#
# THIS FILE IS MEDICAL CONTENT. It is the source of truth for every range the
# platform grades against, and it is deliberately in git rather than in a table
# so that changes get diffs, blame and a pull request. It must be reviewed by a
# clinician before it is relied upon in production.
#
# STATUS: v1 draft — ranges compiled from the cited literature, NOT yet clinically
# reviewed. Ship nothing user-facing from this file until that review happens.
#
# Two ranges per marker, which is the whole point:
#   standard  — the usual clinical reference interval. Inside it you are
#               statistically unremarkable, which is not the same as well.
#   optimal   — associated with lowest long-term risk in longevity and outcome
#               literature. A result can be standard-normal and still flagged.
#   critical  — outside this, escalate immediately and deterministically,
#               regardless of anything else.
#
# units: factor (and optional offset) to convert THAT unit INTO canonical:
#   canonical = value * factor + offset
#
# sex: omit for markers whose ranges do not differ; otherwise provide
# `ranges_by_sex` with `male` / `female` keys. A marker with sex-specific ranges
# and an unknown sex returns no result rather than a default.

version: global.v1

# ── Clinical sign-off ────────────────────────────────────────────────────────
#
# While `reviewed` is false, `reference_ranges.grade_for_display` returns
# `ungraded` for everything: the app shows the number as printed on the report
# and makes no claim about what it means. Critical bounds are the one exception
# and still escalate, because a critical value cannot wait for a review meeting.
#
# To open the gate, a clinician reviews this file as a pull request and sets all
# three fields in the same commit. `reviewed: true` without a named reviewer and
# a date is refused at load time — there would be no audit trail, which is the
# entire reason this content lives in git.
clinical_review:
  reviewed: false
  reviewer:
  reviewed_at:

biomarkers:

  # ── Metabolic ──────────────────────────────────────────────────────────────
  - id: glucose_fasting
    name: Fasting glucose
    system: metabolic
    canonical_unit: mg/dL
    units:
      mg/dL: 1.0
      mmol/L: 18.0182
    standard: [70, 99]
    optimal: [70, 85]
    critical: [40, 400]
    citation: "Tirosh A et al. (2011) Normal fasting plasma glucose and risk. PMID 21220444"

  - id: hba1c
    name: HbA1c
    system: metabolic
    canonical_unit: "%"
    units:
      "%": 1.0
      mmol/mol: { factor: 0.0915, offset: 2.15 }   # NGSP% = IFCC/10.929 + 2.15
    standard: [4.0, 5.6]
    optimal: [4.8, 5.2]
    critical: [3.0, 15.0]
    citation: "Levine ME et al. (2018) PhenoAge. PMID 29676998; ADA Standards of Care"

  - id: insulin_fasting
    name: Fasting insulin
    system: metabolic
    canonical_unit: uIU/mL
    units:
      uIU/mL: 1.0
      pmol/L: 0.1440
    standard: [2.6, 24.9]
    optimal: [2.6, 5.0]
    critical: [0.5, 100.0]
    citation: "Centenarian cohort studies of fasting insulin. PMID 12970313"

