        # mass, so optimal sits in the lower-middle of the standard interval
        # rather than below it.
        optimal: [0.74, 1.00]
      female:
        standard: [0.59, 1.04]
        optimal: [0.60, 0.90]
    critical: [0.2, 10.0]
