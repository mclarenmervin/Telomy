                  - heading "Personal baselines" [level=4] [ref=e217]
                  - paragraph [ref=e218]: Recovery and stress are computed against the individual's own rolling baseline. A resting heart rate of 58 is unremarkable for one person and a warning sign for another.
                - generic [ref=e219]:
                  - heading "VO₂ max" [level=4] [ref=e220]
