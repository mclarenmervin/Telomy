                - generic [ref=e222]:
                  - heading "Heart rate recovery" [level=4] [ref=e223]
                  - paragraph [ref=e224]: A blunted recovery below 12 bpm is associated with elevated cardiovascular mortality risk. The platform flags this prominently and directs the person to a physician.
