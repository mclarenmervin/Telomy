                - generic [ref=e66]: SECTION 01
                - heading "Clinical Philosophy" [level=2] [ref=e67]
              - generic [ref=e68]:
                - paragraph [ref=e69]: Nostavia is built on a distinction that most health software ignores.
                - paragraph [ref=e70]:
                  - strong [ref=e71]: Normal ranges
                  - text: are derived from the general population, including people with undiagnosed chronic disease. A result inside a normal range means you are statistically unremarkable. It does not mean you are well.
                - paragraph [ref=e72]:
                  - strong [ref=e73]: Optimal ranges
                  - text: are derived from longevity research, centenarian cohorts, cardiovascular outcome trials and performance physiology. They describe the physiological state associated with the lowest long-term risk.
                - paragraph [ref=e74]: Every interpretation the platform produces is graded against both. A result can be normal and still be flagged for attention. A result outside the normal range is always escalated, never softened.
              - table [ref=e77]:
                - rowgroup [ref=e78]:
                  - row [ref=e79]:
                    - columnheader "Capability" [ref=e80]
                    - columnheader "Conventional" [ref=e81]
                    - columnheader "Nostavia" [ref=e82]
                - rowgroup [ref=e83]:
                  - row [ref=e84]:
                    - cell "Reference ranges" [ref=e85]
                    - cell "Single standard clinical range" [ref=e86]
                    - 'cell "Dual grading: optimal, normal, abnormal" [ref=e87]'
                  - row [ref=e88]:
                    - cell "Lab interpretation" [ref=e89]
                    - cell "Flags values outside range" [ref=e90]
                    - cell "Cross-panel correlation with wearable and lifestyle context" [ref=e91]
