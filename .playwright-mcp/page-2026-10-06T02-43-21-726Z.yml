            - generic [ref=e109]:
              - generic [ref=e110]:
                - generic [ref=e111]: SECTION 02
                - heading "Clinical Governance" [level=2] [ref=e112]
              - paragraph [ref=e114]: The reference ranges, thresholds and interpretive language in the platform are reviewed by Nostavia's clinical advisory bench, which includes GMC-registered clinicians, research scientists and qualified nutrition specialists.
              - generic [ref=e115]:
                - generic [ref=e116]:
                  - heading "No autonomous diagnosis" [level=3] [ref=e120]
                  - paragraph [ref=e121]: The platform interprets and contextualises. It does not diagnose, and it does not prescribe.
                - generic [ref=e122]:
                  - heading "Clinician override" [level=3] [ref=e127]
                  - paragraph [ref=e128]: Partner clinicians can adjust reference ranges, suppress modules, and control the language shown to their patients. Our defaults are defaults, not mandates.
                - generic [ref=e129]:
                  - heading "Traceability" [level=3] [ref=e134]
                  - paragraph [ref=e135]: Every score and range maps to a published source. Where a threshold is our own composite judgement, we say so rather than implying literature support that does not exist.
                - generic [ref=e136]:
                  - heading "Conservative escalation" [level=3] [ref=e140]
                  - paragraph [ref=e141]: Where a signal has established clinical significance, the platform surfaces it prominently and directs the person to a qualified clinician rather than attempting to manage it.
            - generic [ref=e143]:
              - generic [ref=e144]:
                - generic [ref=e145]: SECTION 03
                - heading "Biological Age" [level=2] [ref=e146]
              - generic [ref=e147]:
                - paragraph [ref=e148]: Nostavia estimates biological age using a biomarker deviation model, in the tradition of PhenoAge (Levine et al., 2018) and the Klemera-Doubal method (2006).
                - paragraph [ref=e149]:
                  - strong [ref=e150]: Method.
                  - text: Each biomarker's distance from its optimal range is converted into an aging surplus or deficit expressed in years, weighted by the strength of that marker's association with mortality and healthspan in the literature, and combined with chronological age.
              - generic [ref=e151]:
                - heading "Safeguards built into the model" [level=3] [ref=e152]
                - list [ref=e153]:
                  - listitem [ref=e154]:
                    - generic [ref=e155]: "1"
                    - generic [ref=e156]: A minimum number of valid biomarkers is required before any estimate is produced. Sparse data returns no result rather than a confident guess.
                  - listitem [ref=e157]:
                    - generic [ref=e158]: "2"
                    - generic [ref=e159]: Each individual marker’s contribution is capped, so no single abnormal value can dominate the estimate.
                  - listitem [ref=e160]:
                    - generic [ref=e161]: "3"
                    - generic [ref=e162]: The final output is bounded relative to chronological age to prevent implausible results.
              - generic [ref=e163]:
                - paragraph [ref=e164]:
                  - strong [ref=e165]: "Contributing markers:"
                  - text: fasting glucose, HbA1c, HDL and LDL cholesterol, triglycerides, creatinine, ALT, haemoglobin, TSH and vitamin D.
                - paragraph [ref=e166]:
                  - strong [ref=e167]: Epigenetic clocks.
                  - text: "Where a person has completed validated epigenetic testing through a third-party laboratory, Nostavia displays and tracks the results rather than recomputing them: Horvath, Hannum, PhenoAge, GrimAge and DunedinPACE."
              - paragraph [ref=e169]:
                - strong [ref=e170]: What this is not.
                - text: Our biomarker-derived biological age is a metabolic estimate, not an epigenetic measurement. It is not interchangeable with a methylation clock, and we label it accordingly everywhere it appears.
            - generic [ref=e172]:
