                - heading "Known Limitations" [level=2] [ref=e566]
              - paragraph [ref=e568]: We would rather state these than have a clinician find them.
              - generic [ref=e569]:
                - generic [ref=e570]:
                  - heading "Consumer-grade sensors" [level=4] [ref=e571]
                  - paragraph [ref=e572]: Wearable-derived HRV, sleep staging and energy expenditure are approximations. Accuracy varies by device, by wear position, and by individual. Sleep staging in particular is less accurate than polysomnography.
                - generic [ref=e573]:
                  - heading "Biological age is an estimate" [level=4] [ref=e574]
                  - paragraph [ref=e575]: It is directional and useful for tracking change over time. A single reading should not be treated as a measurement.
                - generic [ref=e576]:
                  - heading "Population models applied to individuals" [level=4] [ref=e577]
                  - paragraph [ref=e578]: Reference ranges and physiological formulas are derived from population studies. Individual variation is real, and pregnancy, chronic disease, medication and certain ethnic and genetic factors can shift what is appropriate.
                - generic [ref=e579]:
                  - heading "Language models make errors" [level=4] [ref=e580]
                  - paragraph [ref=e581]: Explanatory text and generated protocols are reviewed and constrained, but they are not infallible.
                - generic [ref=e582]:
                  - heading "Correlation is not causation" [level=4] [ref=e583]
                  - paragraph [ref=e584]: Discovered patterns describe association within one person’s data over a limited window.
                - generic [ref=e585]:
                  - heading "Nutrition analysis from images is approximate" [level=4] [ref=e586]
                  - paragraph [ref=e587]: Portion size, hidden fats, oils and preparation method are inferred rather than measured, as described in the nutrition section.
