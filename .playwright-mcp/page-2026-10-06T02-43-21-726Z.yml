                - paragraph [ref=e330]: Partner institutions can override any of these ranges to match their own clinical protocols or local laboratory standards.
              - generic [ref=e331]:
                - generic [ref=e332]:
                  - heading "Unit standardisation" [level=4] [ref=e333]
                  - paragraph [ref=e334]: All incoming results are normalised to canonical units before interpretation, so a report in mmol/L and one in mg/dL produce identical clinical reasoning.
                - generic [ref=e335]:
                  - heading "Extended panels" [level=4] [ref=e336]
                  - paragraph [ref=e337]: Gut microbiome, pharmacogenomic and wellness genetics (MTHFR, APOE, COMT, VDR, CYP1A2), epigenetic age, and heavy metals panels.
                - generic [ref=e338]:
                  - heading "Research-grade markers" [level=4] [ref=e340]
                  - paragraph [ref=e341]: NAD+, telomere length, sirtuin and mTOR activity, and certain inflammatory cytokines are labelled as research-grade and excluded from biological age and risk outputs.
            - generic [ref=e343]:
              - generic [ref=e344]:
                - generic [ref=e345]: SECTION 06
                - heading "Pattern Discovery" [level=2] [ref=e346]
              - generic [ref=e347]:
                - paragraph [ref=e348]: Nostavia's correlation engine identifies relationships between health signals over time using Pearson correlation on aligned time-series data.
                - paragraph [ref=e349]: A correlation is only surfaced when it clears a minimum data volume, exceeds a minimum coefficient magnitude, and matches a physiologically plausible direction. Statistical association alone is never sufficient. Every reportable pattern has a stated clinical rationale.
              - generic [ref=e350]:
                - heading "Relationships the engine tests" [level=3] [ref=e351]
                - list [ref=e352]:
                  - listitem [ref=e353]:
                    - generic [ref=e356]: Sleep duration against next-day HRV and resting heart rate
                  - listitem [ref=e357]:
                    - generic [ref=e360]: Diet quality score against next-day autonomic markers
                  - listitem [ref=e361]:
                    - generic [ref=e364]: Late evening eating against overnight recovery
                  - listitem [ref=e365]:
                    - generic [ref=e368]: Sustained training load against recovery trajectory
                  - listitem [ref=e369]:
                    - generic [ref=e372]: "Multi-signal patterns: short sleep alongside elevated glycaemic markers, or declining HRV alongside elevated inflammatory markers"
              - paragraph [ref=e374]:
                - strong [ref=e375]: Association ≠ Causation.
                - text: Correlations are presented as observations about that individual, with an explicit note that association is not causation. The platform does not tell someone that one thing caused another.
            - generic [ref=e377]:
              - generic [ref=e378]:
                - generic [ref=e379]: SECTION 07
                - heading "Nutrition Intelligence" [level=2] [ref=e380]
              - paragraph [ref=e382]: "Nostavia analyses food from a photograph and returns more than a calorie estimate: predicted metabolic response, degree of processing, appropriateness for the time of day, and effect on nutrient absorption."
              - generic [ref=e383]:
                - generic [ref=e384]:
                  - heading "Two-stage analysis" [level=4] [ref=e389]
                  - paragraph [ref=e390]: A fast pass identifies the meal and estimates macronutrients within seconds. A deeper pass produces the full metabolic profile.
                - generic [ref=e391]:
                  - heading "Closed-loop validation" [level=4] [ref=e395]
                  - paragraph [ref=e396]: After a scanned meal, the platform compares its predicted metabolic response against the person's actual heart rate response. Predictions contradicted by the person's own physiology are marked as such.
                - generic [ref=e397]:
                  - heading "Accuracy limits, stated plainly" [level=4] [ref=e401]
                  - paragraph [ref=e402]: Photograph-based nutrition estimation is approximate. Portion size, hidden fats, oils and preparation method are inferred rather than measured. It is not a substitute for weighed intake in a clinical setting.
            - generic [ref=e404]:
              - generic [ref=e405]:
                - generic [ref=e406]: SECTION 08
                - heading "Behavioural & Predictive Modelling" [level=2] [ref=e407]
              - generic [ref=e408]:
                - generic [ref=e409]:
                  - heading "Habit modelling" [level=4] [ref=e413]
                  - paragraph [ref=e414]: The platform learns individual timing patterns — typical wake, meal and sleep times — using exponentially weighted moving averages, with confidence scores that rise as data accumulates. Below a minimum data threshold, no prediction is made. Gradual drift is detected via linear regression and surfaced when clinically meaningful.
                - generic [ref=e415]:
                  - heading "Adaptive timing" [level=4] [ref=e427]
                  - paragraph [ref=e428]: Notifications and prompts are scheduled around predicted individual rhythms rather than fixed clock times, and are suppressed entirely when confidence is low.
                - generic [ref=e429]:
                  - heading "Scenario projection" [level=4] [ref=e433]
                  - paragraph [ref=e434]: Nostavia can project likely trajectories across short and long horizons. These are educational models built on population-level relationships, clearly labelled as scenarios rather than predictions, and are never presented as individual disease risk assessment.
            - generic [ref=e436]:
              - generic [ref=e437]:
                - generic [ref=e438]: SECTION 09
                - 'heading "Artificial Intelligence: Scope & Limits" [level=2] [ref=e439]'
              - paragraph [ref=e441]: AI is one component of the platform, not the whole of it.
              - generic [ref=e442]:
                - generic [ref=e443]:
                  - heading "What is deterministic" [level=3] [ref=e448]
                  - paragraph [ref=e449]: All physiological scoring, reference range grading, biological age computation, unit conversion, correlation statistics and safety thresholds are computed by fixed, auditable logic. These produce identical outputs for identical inputs. No language model is involved in producing a number.
                - generic [ref=e450]:
                  - heading "What is AI-assisted" [level=3] [ref=e462]
                  - paragraph [ref=e463]: Natural language explanation of results, extraction of values from uploaded laboratory documents, food recognition from images, protocol drafting, and conversational interaction.
              - generic [ref=e464]:
                - heading "Controls we apply" [level=3] [ref=e465]
                - list [ref=e466]:
                  - listitem [ref=e467]:
                    - generic [ref=e471]: Model outputs are constrained to structured formats and validated before they reach a person
                  - listitem [ref=e472]:
                    - generic [ref=e476]: Clinical thresholds and reference ranges are held outside the model — a model cannot change what counts as abnormal
                  - listitem [ref=e477]:
                    - generic [ref=e481]: Extracted laboratory values are surfaced for confirmation rather than silently trusted
                  - listitem [ref=e482]:
                    - generic [ref=e486]: Generated protocols respect hard constraints including dietary boundaries and biometric state; where recovery is poor or stress is elevated, intensity is reduced regardless of what the plan called for
                  - listitem [ref=e487]:
                    - generic [ref=e491]: Long-term context is stored as vector embeddings rather than raw conversation text
              - paragraph [ref=e493]:
                - strong [ref=e494]: What AI does not do.
                - text: It does not diagnose. It does not alter a reference range. It does not decide whether a result is abnormal. It does not act on a person's health without a human in the loop.
            - generic [ref=e496]:
              - generic [ref=e497]:
                - generic [ref=e498]: SECTION 10
                - heading "Safety Systems" [level=2] [ref=e499]
              - generic [ref=e500]:
                - generic [ref=e501]:
                  - heading "Emergency language detection" [level=3] [ref=e502]
                  - paragraph [ref=e503]: Every message is screened for language indicating a medical or psychological emergency before it reaches any AI processing. When triggered, the platform returns emergency contact guidance and a direction to seek immediate help. The ordinary response path is bypassed entirely.
                  - paragraph [ref=e504]: This is a supplementary safeguard. It is not an emergency service, it is not a substitute for one, and we do not present it as one.
                - generic [ref=e505]:
                  - heading "Clinical escalation thresholds" [level=3] [ref=e506]
                  - paragraph [ref=e507]: Signals with established clinical significance — blunted heart rate recovery, sustained autonomic suppression, sustained elevation in resting heart rate above personal baseline, and severe sleep deficit — are flagged prominently with a recommendation to consult a qualified clinician.
                  - paragraph [ref=e508]: The platform escalates. It does not attempt to manage.
            - generic [ref=e510]:
              - generic [ref=e511]:
                - generic [ref=e512]: SECTION 11
                - heading "Data, Privacy & Security" [level=2] [ref=e513]
              - paragraph [ref=e515]:
                - strong [ref=e516]: "Sources:"
                - text: Apple HealthKit, Google Health Connect, connected wearables, laboratory reports uploaded or integrated directly, food images, and self-reported assessment data.
              - generic [ref=e517]:
                - generic [ref=e518]:
                  - heading "On-device computation" [level=4] [ref=e523]
                  - paragraph [ref=e524]: Physiological scoring from wearable data is computed locally on the device wherever possible.
                - generic [ref=e525]:
                  - heading "No credentials on device" [level=4] [ref=e529]
                  - paragraph [ref=e530]: All external model calls are proxied server-side. Keys are never distributed to clients.
                - generic [ref=e531]:
                  - heading "Row-level isolation" [level=4] [ref=e536]
                  - paragraph [ref=e537]: Every record is scoped to its owner at the database layer, not merely at the application layer.
                - generic [ref=e538]:
                  - heading "Data minimisation" [level=4] [ref=e543]
                  - paragraph [ref=e544]: Only the fields required for a given computation are transmitted to any external service.
                - generic [ref=e545]:
                  - heading "Deployment flexibility" [level=4] [ref=e549]
                  - paragraph [ref=e550]: For institutional partners, Nostavia can deploy into a partner-owned database and infrastructure account, so patient data remains within the partner’s control and jurisdiction.
              - paragraph [ref=e551]: Partner-specific security documentation, including current certification status and sub-processor detail, is available under NDA to institutions in active evaluation.
            - generic [ref=e553]:
              - generic [ref=e554]:
                - generic [ref=e555]: SECTION 12
                - heading "What We Do Not Publish" [level=2] [ref=e556]
              - generic [ref=e558]:
                - paragraph [ref=e559]: We publish the models, the sources, the thresholds and the reasoning. We do not publish the exact weighting coefficients and normalisation constants inside our composite scores.
                - paragraph [ref=e560]: That is a deliberate line. Those parameters are the product of clinical review and iteration, and they are what a partner is licensing. Publishing them would not make the platform more trustworthy — it would only make it easier to copy.
                - paragraph [ref=e561]: Any partner institution evaluating Nostavia can review the full parameter set under NDA, and any partner clinician can inspect the exact reasoning behind an individual result.
